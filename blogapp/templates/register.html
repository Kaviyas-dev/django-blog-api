<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | My Blog</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }


        .register-container {

            width: 450px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);
        }


        .register-container h1 {

            text-align: center;

            color: #333;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }


        .form-field {

            margin-bottom: 18px;
        }


        .form-field label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }


        .form-field input {

            width: 100%;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;
        }


        .form-field input:focus {

            outline: none;

            border-color: #667eea;
        }


        .helptext {

            display: block;

            font-size: 12px;

            color: #888;

            margin-top: 5px;
        }


        .register-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2ecc71;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 10px;
        }


        .register-btn:hover {

            background: #27ae60;
        }


        .login-link {

            text-align: center;

            margin-top: 25px;

            color: #666;
        }


        .login-link a {

            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }


        .errorlist {

            color: #e74c3c;

            font-size: 13px;

            margin: 5px 0;

            padding-left: 20px;
        }

    </style>

</head>


<body>


    <div class="register-container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join our blog community
        </p>


        <form method="POST">

            {% csrf_token %}


            {% for field in form %}

                <div class="form-field">

                    {{ field.label_tag }}

                    {{ field }}

                    {% if field.errors %}

                        {{ field.errors }}

                    {% endif %}

                    {% if field.help_text %}

                        <small class="helptext">
                            {{ field.help_text }}
                        </small>

                    {% endif %}

                </div>

            {% endfor %}


            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>

        </form>


        <p class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>


</body>

</html>
