<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ post.title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .post-card {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        .info {
            color: #777;
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            margin-right: 10px;
            padding: 10px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="post-card">

        <h1>{{ post.title }}</h1>

        <p class="description">
            {{ post.description }}
        </p>

        <div class="info">
            <p>
                <strong>Created:</strong>
                {{ post.created_at }}
            </p>

            <p>
                <strong>Author:</strong>
                {{ post.author }}
            </p>
        </div>

        <a href="{% url 'update' post.id %}">Edit</a>

        <a href="{% url 'delete' post.id %}">Delete</a>

        <a href="{% url 'home' %}">Back</a>

    </div>

</body>
</html>
